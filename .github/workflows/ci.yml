name: BASKET CI

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

jobs:
  backend-ci:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: basket
          POSTGRES_PASSWORD: basket_secret
          POSTGRES_DB: basket_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: backend
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Lint and Format Check with Ruff
        working-directory: backend
        run: |
          source .venv/bin/activate
          ruff check app tests alembic
          ruff format --check app tests alembic

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://basket:basket_secret@localhost:5432/basket_db
        run: |
          source .venv/bin/activate
          alembic upgrade head

      - name: Run Backend Test Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://basket:basket_secret@localhost:5432/basket_db
          SECRET_KEY: test_insecure_secret_key_for_ci_pipeline_only_32_chars
          INTERNAL_SERVICE_KEY: test_internal_service_key_for_ci_only_32chars
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  frontend-ci:
    name: Frontend Lint, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Type Check
        working-directory: frontend
        run: npm run type-check

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENVIRONMENT: production
        run: npm run build
